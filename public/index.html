<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Learning Demo</title><link rel="stylesheet" href="/styles.css"></head><body><main class="container"><h1>Учебный кабинет родителя</h1><p>Демо-приложение для QA-портфолио. Не является продуктом Учи.ру.</p><section class="card"><h2>Вход</h2><label>Email <input id="email" type="email" placeholder="parent@example.com"></label><label>Пароль <input id="password" type="password" placeholder="минимум 6 символов"></label><button id="login-button">Войти</button><p id="login-message" role="status"></p></section><section class="card"><h2>Курсы</h2><button id="load-courses">Загрузить курсы</button><ul id="course-list"></ul></section><section class="card"><h2>Обратная связь</h2><textarea id="feedback" placeholder="Ваше сообщение"></textarea><button id="send-feedback">Отправить</button><p id="feedback-message" role="status"></p></section></main><script src="/app.js"></script></body></html>
